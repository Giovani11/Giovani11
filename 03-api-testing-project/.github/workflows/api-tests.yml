name: Newman API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 03-api-testing-project/package.json

      - name: Install Dependencies
        working-directory: 03-api-testing-project
        run: npm install

      - name: Execute API Collection with Newman
        working-directory: 03-api-testing-project
        run: npm test
